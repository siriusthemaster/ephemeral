[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
auto_detect_remappings = false
fs_permissions = [{ access = "read", path = "./test/fixtures" }] # test/fixtures/epoch7.json, written by ts/fixture.ts

[profile.default.fuzz]
runs = 256
