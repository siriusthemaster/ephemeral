# Total value unlinked: daily collector. See tvu/METHOD.md.
name: tvu

on:
  schedule:
    - cron: '40 0 * * *'
  workflow_dispatch:

env:
  RPC_ETHEREUM: ${{ secrets.RPC_ETHEREUM }}
  RPC_ARBITRUM: ${{ secrets.RPC_ARBITRUM }}
  RPC_OPTIMISM: ${{ secrets.RPC_OPTIMISM }}
  RPC_POLYGON: ${{ secrets.RPC_POLYGON }}
  RPC_BASE: ${{ secrets.RPC_BASE }}
  RPC_GNOSIS: ${{ secrets.RPC_GNOSIS }}

jobs:
  tvu:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    concurrency:
      group: tvu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: stats-data
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Collect
        run: node --import tsx tvu/collect.ts --data data --budget-minutes 300
      - name: Commit to stats-data
        run: |
          cd data
          for f in tvu.json checkpoint.json *.addr.gz *.skip.gz; do [ -e "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git -c user.name=siriusthemaster -c user.email=210255227+siriusthemaster@users.noreply.github.com commit -m "tvu: daily update"
          for i in 1 2 3; do
            git pull --rebase origin stats-data && git push origin HEAD:stats-data && exit 0
            sleep 5
          done
          exit 1
