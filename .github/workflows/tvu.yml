# Total value unlinked: daily collector. See tvu/METHOD.md.
# The tvu-test job (push to feat/tvu) is temporary: it never writes stats-data.
name: tvu

on:
  schedule:
    - cron: '40 0 * * *'
  workflow_dispatch:
  push:
    branches: [feat/tvu]

env:
  RPC_ETHEREUM: ${{ vars.RPC_ETHEREUM }}
  RPC_ARBITRUM: ${{ vars.RPC_ARBITRUM }}
  RPC_OPTIMISM: ${{ vars.RPC_OPTIMISM }}
  RPC_POLYGON: ${{ vars.RPC_POLYGON }}
  RPC_BASE: ${{ vars.RPC_BASE }}
  RPC_GNOSIS: ${{ vars.RPC_GNOSIS }}

jobs:
  tvu:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    concurrency:
      group: tvu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: stats-data
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Collect
        run: node --import tsx tvu/collect.ts --data data --budget-minutes 300
      - name: Commit to stats-data
        run: |
          cd data
          git add tvu.json checkpoint.json ./*.addr.gz ./*.skip.gz
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git -c user.name=siriusthemaster -c user.email=210255227+siriusthemaster@users.noreply.github.com commit -m "tvu: daily update"
          for i in 1 2 3; do
            git pull --rebase origin stats-data && git push origin HEAD:stats-data && exit 0
            sleep 5
          done
          exit 1

  tvu-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: read
    concurrency:
      group: tvu-test
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: mkdir -p data
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: tvu-ckpt-${{ github.run_id }}
          restore-keys: tvu-ckpt-
      - name: Collect (no publish)
        run: |
          set -o pipefail
          node --import tsx tvu/collect.ts --data data --budget-minutes 25 --no-publish | tee data/run.log
      - name: Summary
        if: always()
        run: |
          {
            echo '### tvu test run'
            grep -E '^(cross check|summary|prices|[a-z]+: )' data/run.log | tail -60 | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tvu-preview
          path: data/tvu.preview.json
          if-no-files-found: ignore
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: tvu-ckpt-${{ github.run_id }}
